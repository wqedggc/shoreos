<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ShoreOS</title>
  <style>
    html,body{height:100%;margin:0;background:#fff7ed;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    .boot{height:100%;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:14px}
  </style>
</head>
<body>
  <div class="boot">正在进入 ShoreOS…</div>
  <script>
  (async function(){
    try{
      const res = await fetch('/app.html', { cache: 'no-store' });
      if(!res.ok) throw new Error('app.html ' + res.status);
      let html = await res.text();
      html = html.replace('</head>', '<link rel="stylesheet" href="/shoreos-extension.css?v=1"></head>');
      html = html.replace('</body>', '<script src="/shoreos-extension.js?v=1"><\/script></body>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML = '<div class="boot">ShoreOS 加载失败：'+String(err.message||err)+'</div>';
    }
  })();
  </script>
</body>
</html>
