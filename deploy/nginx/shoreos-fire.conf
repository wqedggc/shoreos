# Place this file under /etc/nginx/conf.d/ after replacing every placeholder.
# This file is intended for the nginx http context (conf.d include).

limit_req_zone $binary_remote_addr zone=shoreos_fire_login:10m rate=10r/m;

server {
    listen 80;
    server_name <fire.example.invalid>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <fire.example.invalid>;

    ssl_certificate     <path-to-tls-certificate>;
    ssl_certificate_key <path-to-tls-private-key>;

    root <path-to-taro-h5-dist>;
    index index.html;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/auth/login {
        limit_req zone=shoreos_fire_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/bootstrap {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
